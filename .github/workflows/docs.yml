name: Docs

# Build the MkDocs site (strict) on every push/PR; deploy to GitHub Pages on main
# via the official GitHub Actions Pages deployment (not a gh-pages branch push).
on:
  push:
    branches: [main, deployment-readiness-audit]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Serialize Pages deployments; let an in-progress publish finish rather than
# cancelling it, so a deploy is never interrupted mid-write.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.24"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build docs (strict)
        run: uv run --frozen --group docs mkdocs build --strict
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # PRs and other branches only build (validate) above; main publishes.
    if: github.ref == 'refs/heads/main'
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to Pages
      id-token: write # OIDC token for actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
