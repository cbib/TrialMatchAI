name: CI

on:
  push:
    branches: [main, dev, 'production/**']
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    uses: ./.github/workflows/verify.yml
