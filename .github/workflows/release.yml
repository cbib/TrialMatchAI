name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  verification:
    uses: ./.github/workflows/verify.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}

  pypi-publish:
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trialmatchai-dist-${{ github.sha }}
          path: dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.24"
      - name: Verify the tested artifacts
        env:
          PYTHONPATH: src
        run: python -m trialmatchai artifacts verify dist/SHA256SUMS --require-exact --json
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Publish the tested distributions with OIDC
        run: uv publish dist/*.whl dist/*.tar.gz --trusted-publishing always
