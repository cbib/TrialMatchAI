<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
  <title id="title">TrialMatchAI default matching flow</title>
  <desc id="desc">Imported patient profiles pass through first-level trial retrieval, second-level criterion retrieval, eligibility assessment, final ranking, and human review. Eligibility assessment is enabled by default and supports CoT or direct JSON prompts. A local index supports both retrieval stages. Query expansion is off by default; LLM reranking is on by default. Explicitly disabling assessment selects a retrieval-only bypass.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101b32"/><stop offset="1" stop-color="#082f38"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#5eead4" stroke-width="1.3"/></marker>
    <marker id="branch-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#93c5fd" stroke-width="1.3"/></marker>
    <marker id="bypass-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#94a3b8" stroke-width="1.3"/></marker>
  </defs>
  <rect width="1120" height="400" rx="16" fill="url(#background)"/>
  <g font-family="DejaVu Sans,Segoe UI,Arial,sans-serif">
    <text x="28" y="34" font-size="13" font-weight="700" letter-spacing="1.7" fill="#5eead4">DEFAULT MATCHING WORKFLOW</text>
    <path d="M730 29h26" stroke="#5eead4" stroke-width="1.5"/>
    <text x="766" y="34" font-size="12" fill="#cbd5e1">Main path</text>
    <path d="M866 29h26" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="902" y="34" font-size="12" fill="#cbd5e1">Configurable branch</text>
    <g fill="none" stroke="#5eead4" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M184 161H208"/><path d="M364 161H388"/>
      <path d="M544 161H568"/><path d="M724 161H748"/><path d="M904 161H928"/>
      <path d="M366 104V115H286V127"/><path d="M386 104V115H466V127"/>
    </g>
    <g fill="#102e40" stroke="#315362">
      <rect x="28" y="127" width="156" height="68" rx="9"/>
      <rect x="208" y="127" width="156" height="68" rx="9" fill="#0b4249" stroke="#238b87"/>
      <rect x="388" y="127" width="156" height="68" rx="9" fill="#0b4249" stroke="#238b87"/>
      <rect x="568" y="127" width="156" height="68" rx="9" fill="#0b4249" stroke="#5eead4"/>
      <rect x="748" y="127" width="156" height="68" rx="9" fill="#0b4249" stroke="#238b87"/>
      <rect x="928" y="127" width="164" height="68" rx="9"/>
      <rect x="266" y="66" width="220" height="38" rx="19"/>
    </g>
    <g fill="#f8fafc" text-anchor="middle" font-size="15" font-weight="600">
      <text x="106" y="153">Patient profile</text><text x="286" y="153">First level</text>
      <text x="466" y="153">Second level</text><text x="646" y="149" font-size="14">Eligibility</text><text x="646" y="165" font-size="14">assessment</text>
      <text x="826" y="153">Final ranking</text><text x="1010" y="153">JSON + HTML</text>
    </g>
    <g fill="#cbd5e1" text-anchor="middle" font-size="12">
      <text x="106" y="177" font-size="11">Imported input + summary</text><text x="286" y="177">Trial retrieval + fusion</text>
      <text x="466" y="177">Criterion retrieval</text><text x="646" y="184" fill="#5eead4" font-size="11">Default on · CoT / JSON</text>
      <text x="826" y="177">Ranked shortlist</text><text x="1010" y="177">Human review</text>
      <text x="376" y="90">Local trial + criterion index</text>
    </g>
    <g fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#branch-arrow)">
      <path d="M106 195V242"/><path d="M238 269H286V195"/>
      <path d="M466 195V242"/><path d="M568 269H646V195"/>
    </g>
    <g fill="#162c47" stroke="#658bba" stroke-dasharray="5 4">
      <rect x="54" y="242" width="184" height="54" rx="9"/>
      <rect x="380" y="242" width="188" height="54" rx="9"/>
    </g>
    <g text-anchor="middle" fill="#dbeafe" font-size="14">
      <text x="146" y="264">Query expansion</text><text x="474" y="264">LLM reranking</text>
      <text x="146" y="284" font-size="11" fill="#b5cbd5">Off by default</text>
      <text x="474" y="284" font-size="11" fill="#b5cbd5">On by default</text>
    </g>
    <path d="M406 195V219H352V354H818V195" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 5" marker-end="url(#bypass-arrow)"/>
    <text x="580" y="344" text-anchor="middle" font-size="12" fill="#cbd5e1">Assessment disabled → retrieval-only bypass</text>
  </g>
</svg>
