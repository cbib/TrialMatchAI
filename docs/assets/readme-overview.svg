<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">TrialMatchAI</title>
  <desc id="desc">Patient profiles flow through trial retrieval and criterion review into ranked reports. A configurable CLI with local search and configurable model stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b32"/><stop offset="1" stop-color="#082f38"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cbd5e1" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="40" r="180" fill="#14b8a6" opacity=".055"/>
  <circle cx="1080" cy="40" r="116" fill="none" stroke="#5eead4" stroke-opacity=".1"/>
  <g font-family="DejaVu Sans,Segoe UI,Arial,sans-serif">
    <text x="52" y="54" font-size="12" font-weight="700" letter-spacing="3" fill="#5eead4">CLINICAL TRIAL RETRIEVAL · OPEN SOURCE</text>
    <text x="48" y="121" font-size="58" font-weight="700" letter-spacing="-2" fill="#f8fafc">TrialMatch<tspan fill="#5eead4">AI</tspan></text>
    <text x="52" y="159" font-size="21" fill="#cbd5e1">From patient information to a reviewable trial shortlist.</text>
    <g transform="translate(52 210)">
      <path d="M242 64H286M528 64H572M814 64H858" stroke="#5eead4" stroke-opacity=".6" stroke-width="2"/>
      <path d="m279 59 7 5-7 5m286-10 7 5-7 5m286-10 7 5-7 5" fill="none" stroke="#5eead4" stroke-width="2"/>
      <g fill="#102e40" stroke="#315362">
        <rect width="240" height="124" rx="12"/>
        <rect x="286" width="240" height="124" rx="12"/>
        <rect x="572" width="240" height="124" rx="12"/>
        <rect x="858" width="186" height="124" rx="12"/>
      </g>
      <g font-size="11" font-weight="700" letter-spacing="1.6" fill="#5eead4">
        <text x="20" y="29">01 / IMPORT</text><text x="306" y="29">02 / RETRIEVE</text>
        <text x="592" y="29">03 / ASSESS</text><text x="878" y="29">04 / REVIEW</text>
      </g>
      <g font-size="20" font-weight="600" fill="#f8fafc">
        <text x="20" y="64">Patient profiles</text><text x="306" y="64">Trial candidates</text>
        <text x="592" y="64">Criterion evidence</text><text x="878" y="64">Ranked reports</text>
      </g>
      <g font-size="13" fill="#b5cbd5">
        <text x="20" y="93">Text · FHIR · Phenopacket · OMOP</text><text x="306" y="93">Local lexical + vector search</text>
        <text x="592" y="93">Assessment enabled by default</text><text x="878" y="93">JSON + HTML</text>
      </g>
    </g>
    <rect x="52" y="370" width="28" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="92" y="377" font-size="13" fill="#cbd5e1">Python 3.11</text>
    <circle cx="208" cy="372" r="2" fill="#5eead4"/>
    <text x="223" y="377" font-size="13" fill="#cbd5e1">Synthetic CPU demo</text>
    <circle cx="390" cy="372" r="2" fill="#5eead4"/>
    <text x="405" y="377" font-size="13" fill="#cbd5e1">Human review required</text>
    <text x="1094" y="377" font-size="12" text-anchor="end" letter-spacing="1.2" fill="#7dd3fc">BETA / v0.9</text>
  </g>
</svg>
